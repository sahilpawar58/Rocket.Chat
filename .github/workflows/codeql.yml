name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - analysis-1y-old

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - run: npm install

      - run: npm run build --if-present

      - uses: github/codeql-action/analyze@v3
